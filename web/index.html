<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频源管理器</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #8b93a3;
    --accent: #4f8cff;
    --ok: #32c48d;
    --warn: #e0a13a;
    --err: #e5544b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 18px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px; margin-bottom: 16px;
  }
  .card h2 { font-size: 14px; margin: 0 0 14px; color: var(--text); font-weight: 600; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .field { flex: 1 1 220px; display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; color: var(--muted); }
  input, select {
    width: 100%; background: var(--panel2); border: 1px solid var(--border);
    color: var(--text); border-radius: 7px; padding: 9px 10px; font-size: 13px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input::placeholder { color: #5a6273; }
  .btn {
    border: 1px solid var(--border); background: var(--panel2); color: var(--text);
    border-radius: 7px; padding: 9px 16px; font-size: 13px; cursor: pointer;
    transition: .15s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #06231a; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .btn.danger { color: var(--err); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .count { color: var(--muted); font-size: 12px; }
  .grow { flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.api { word-break: break-all; color: #a9b4c8; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .name-cell { font-weight: 500; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: #232833; border: 1px solid var(--border); color: var(--text);
    padding: 11px 18px; border-radius: 9px; font-size: 13px; max-width: 90%;
    box-shadow: 0 8px 30px rgba(0,0,0,.45); opacity: 0; pointer-events: none;
    transition: .25s; z-index: 50;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  #toast.ok { border-color: var(--ok); }
  #toast.err { border-color: var(--err); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; border: 1px solid var(--border); color: var(--muted); }
  .table-scroll { max-height: 480px; overflow: auto; }
  .table-scroll thead th { position: sticky; top: 0; background: var(--panel); }
  code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>视频源管理器</h1>
  <div class="sub">添加、去重、提交 <code>sources.json</code>，提交后 GitHub Actions 会自动检测</div>

  <div class="card">
    <h2>仓库连接</h2>
    <div class="row">
      <div class="field" style="flex:1 1 140px">
        <label>Owner</label>
        <input id="owner" placeholder="用户名">
      </div>
      <div class="field" style="flex:1 1 180px">
        <label>仓库</label>
        <input id="repo" placeholder="仓库名">
      </div>
      <div class="field" style="flex:0 1 90px">
        <label>分支</label>
        <input id="branch" value="main">
      </div>
      <div class="field" style="flex:2 1 320px">
        <label>GitHub Token（保存时需要，含 repo 权限）</label>
        <input id="token" type="password" placeholder="ghp_... 可留空仅浏览/下载">
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="loadBtn">加载 sources.json</button>
      <button class="btn" id="downloadBtn">下载 sources.json</button>
      <span class="grow"></span>
      <button class="btn ok" id="saveBtn" disabled>保存到 GitHub</button>
    </div>
    <div class="hint">Token 只保存在本机浏览器 localStorage，不会写入仓库。读取公开仓库可留空。</div>
  </div>

  <div class="card">
    <h2>添加新源</h2>
    <div class="row">
      <div class="field" style="flex:1 1 200px">
        <label>资源名称 *</label>
        <input id="name" placeholder="例如：某某资源">
      </div>
      <div class="field" style="flex:2 1 340px">
        <label>API 地址 *</label>
        <input id="api" placeholder="https://example.com/api.php/provide/vod">
      </div>
      <div class="field" style="flex:1 1 220px">
        <label>站点主页（可选）</label>
        <input id="detail" placeholder="https://example.com">
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="addBtn">添加到列表</button>
    </div>
  </div>

  <div class="card">
    <h2>源列表</h2>
    <div class="toolbar">
      <input id="search" placeholder="搜索名称或 api" style="flex:1 1 260px">
      <button class="btn small" id="dedupeBtn">检测并去重</button>
      <span class="count" id="count">0 个源</span>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th style="width:34%">名称</th>
            <th style="width:52%">API</th>
            <th style="width:14%">操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" style="display:none">还没有加载数据，先点上方「加载 sources.json」</div>
  </div>
</div>

<div id="toast"></div>

<script>
const DEFAULTS = { owner: "dxs1256", repo: "api-health-check", branch: "main" };
const LS_KEY = "source-manager-config-v1";
const SITES_KEY = "api_site";

const state = { sources: null, sha: null, dirty: false };
const $ = (id) => document.getElementById(id);

function toast(text, type) {
  const el = $("toast");
  el.textContent = text;
  el.className = "show " + (type || "");
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = ""; }, 3200);
}

function normalizeApi(url) {
  return String(url || "").trim().replace(/\/+$/, "");
}

function isHttpUrl(url) {
  try {
    const u = new URL(url);
    return (u.protocol === "http:" || u.protocol === "https:") && !!u.hostname;
  } catch { return false; }
}

function makeKey(api, detail, existing) {
  let base = "";
  for (const url of [detail, api]) {
    if (url && isHttpUrl(url)) {
      base = new URL(url).hostname.toLowerCase().replace(/[^a-z0-9]/g, "");
      if (base) break;
    }
  }
  if (!base) base = "source";
  let key = base, n = 2;
  while (Object.prototype.hasOwnProperty.call(existing, key)) {
    key = base + n++;
  }
  return key;
}

function b64EncodeUnicode(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = "";
  bytes.forEach((b) => { binary += String.fromCharCode(b); });
  return btoa(binary);
}

function b64DecodeUnicode(b64) {
  const binary = atob(String(b64).replace(/\s/g, ""));
  const bytes = Uint8Array.from(binary, (c) => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function conn() {
  return {
    owner: $("owner").value.trim(),
    repo: $("repo").value.trim(),
    branch: $("branch").value.trim() || "main",
    token: $("token").value.trim(),
  };
}

function contentsUrl(c) {
  return `https://api.github.com/repos/${c.owner}/${c.repo}/contents/sources.json`;
}

function apiHeaders(c) {
  const h = { Accept: "application/vnd.github+json" };
  if (c.token) h.Authorization = "token " + c.token;
  return h;
}

function saveConfig() {
  const c = conn();
  localStorage.setItem(LS_KEY, JSON.stringify({ owner: c.owner, repo: c.repo, branch: c.branch, token: c.token }));
}

function restoreConfig() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch {}
  $("owner").value = saved.owner || DEFAULTS.owner;
  $("repo").value = saved.repo || DEFAULTS.repo;
  $("branch").value = saved.branch || DEFAULTS.branch;
  $("token").value = saved.token || "";
}

async function loadSources() {
  const c = conn();
  if (!c.owner || !c.repo) { toast("请先填写 Owner 和仓库名", "err"); return; }
  if ($("token").value) saveConfig();
  const btn = $("loadBtn");
  btn.disabled = true; btn.textContent = "加载中...";
  try {
    let data;
    if (c.token) {
      const res = await fetch(`${contentsUrl(c)}?ref=${encodeURIComponent(c.branch)}`, { headers: apiHeaders(c) });
      if (!res.ok) throw new Error(`GitHub API HTTP ${res.status}`);
      const json = await res.json();
      state.sha = json.sha;
      data = JSON.parse(b64DecodeUnicode(json.content));
    } else {
      const res = await fetch(`https://raw.githubusercontent.com/${c.owner}/${c.repo}/${c.branch}/sources.json?t=${Date.now()}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      data = await res.json();
      state.sha = null;
    }
    if (!data || typeof data !== "object") throw new Error("内容不是合法 JSON 对象");
    if (!data[SITES_KEY] || typeof data[SITES_KEY] !== "object") data[SITES_KEY] = {};
    state.sources = data;
    state.dirty = false;
    render();
    toast(`已加载 ${Object.keys(data[SITES_KEY]).length} 个源`, "ok");
  } catch (e) {
    toast("加载失败：" + e.message, "err");
  } finally {
    btn.disabled = false; btn.textContent = "加载 sources.json";
  }
}

function render() {
  const tbody = $("tbody");
  const empty = $("empty");
  tbody.innerHTML = "";
  if (!state.sources) { empty.style.display = "block"; $("count").textContent = "0 个源"; return; }
  empty.style.display = "none";

  const q = $("search").value.trim().toLowerCase();
  const entries = Object.entries(state.sources[SITES_KEY]);
  const shown = entries.filter(([k, v]) => {
    if (!q) return true;
    return (k + " " + (v.name || "") + " " + (v.api || "")).toLowerCase().includes(q);
  });

  const seen = new Map();
  const dupKeys = new Set();
  for (const [key, src] of entries) {
    const norm = normalizeApi(src.api);
    if (!norm) continue;
    if (seen.has(norm)) dupKeys.add(key);
    else seen.set(norm, key);
  }

  for (const [key, src] of shown) {
    const tr = document.createElement("tr");
    if (dupKeys.has(key)) tr.style.background = "rgba(255, 86, 86, 0.08)";
    const tdName = document.createElement("td");
    tdName.className = "name-cell";
    tdName.textContent = src.name || "(未命名)";
    if (dupKeys.has(key)) {
      const badge = document.createElement("span");
      badge.textContent = " 重复";
      badge.style.color = "#ff5656";
      badge.style.fontSize = "11px";
      tdName.appendChild(badge);
    }
    const tdApi = document.createElement("td");
    tdApi.className = "api";
    tdApi.textContent = src.api || "";
    if (src.detail && src.detail !== "-") {
      const a = document.createElement("a");
      a.href = src.detail; a.target = "_blank"; a.rel = "noopener";
      a.textContent = "主页"; a.style.display = "block"; a.style.fontSize = "11px";
      a.style.color = "var(--muted)"; a.style.marginTop = "3px";
      tdApi.appendChild(a);
    }
    const tdOp = document.createElement("td");
    const del = document.createElement("button");
    del.className = "btn small danger";
    del.textContent = "删除";
    del.onclick = () => removeSource(key);
    tdOp.appendChild(del);
    tr.append(tdName, tdApi, tdOp);
    tbody.appendChild(tr);
  }

  $("count").textContent = q ? `显示 ${shown.length} / ${entries.length} 个源` : `${entries.length} 个源`;
}

function addSource() {
  if (!state.sources) { toast("请先加载 sources.json", "err"); return; }
  const name = $("name").value.trim();
  const api = $("api").value.trim();
  const detail = $("detail").value.trim();
  if (!name) { toast("请填写资源名称", "err"); return; }
  if (!api || !isHttpUrl(api)) { toast("API 地址必须是合法的 http/https 地址", "err"); return; }
  if (detail && !isHttpUrl(detail)) { toast("站点主页必须是合法的 http/https 地址", "err"); return; }

  const norm = normalizeApi(api);
  const apiSite = state.sources[SITES_KEY];
  for (const [k, v] of Object.entries(apiSite)) {
    if (normalizeApi(v.api) === norm) {
      toast(`该 API 已存在：${v.name || k}`, "err");
      return;
    }
  }
  const key = makeKey(api, detail, apiSite);
  apiSite[key] = { name, api, detail: detail || "-" };
  state.dirty = true;
  $("name").value = ""; $("api").value = ""; $("detail").value = "";
  render();
  toast(`已添加：${name}（key: ${key}）`, "ok");
}

function findDuplicateKeys() {
  const apiSite = state.sources[SITES_KEY];
  const seen = new Map();
  const dups = [];
  for (const [key, src] of Object.entries(apiSite)) {
    const norm = normalizeApi(src.api);
    if (!norm) continue;
    if (seen.has(norm)) dups.push([key, seen.get(norm)]);
    else seen.set(norm, key);
  }
  return dups;
}

function dedupeSources() {
  if (!state.sources) { toast("请先加载 sources.json", "err"); return; }
  const dups = findDuplicateKeys();
  if (!dups.length) { toast("未发现重复 api", "ok"); return; }
  const lines = dups.map(([key, first]) => {
    const a = state.sources[SITES_KEY][key];
    const b = state.sources[SITES_KEY][first];
    return `- ${a.name || key}（保留 ${b.name || first}）\n  ${normalizeApi(a.api)}`;
  });
  if (!confirm(`发现 ${dups.length} 个重复 api：\n\n${lines.join("\n")}\n\n每组保留第一个，删除其余项？`)) return;
  for (const [key] of dups) delete state.sources[SITES_KEY][key];
  state.dirty = true;
  render();
  toast(`已移除 ${dups.length} 个重复项，记得保存`, "ok");
}

function removeSource(key) {
  const src = state.sources[SITES_KEY][key];
  if (!confirm(`确定删除「${src.name || key}」？`)) return;
  delete state.sources[SITES_KEY][key];
  state.dirty = true;
  render();
  toast("已从列表移除，记得保存", "ok");
}

async function saveToGitHub() {
  const c = conn();
  if (!c.token) { toast("保存需要填写 GitHub Token", "err"); return; }
  if (!state.sources) { toast("请先加载 sources.json", "err"); return; }
  const btn = $("saveBtn");
  btn.disabled = true; btn.textContent = "保存中...";
  try {
    // 取最新 sha，避免 409 冲突
    const getRes = await fetch(`${contentsUrl(c)}?ref=${encodeURIComponent(c.branch)}`, { headers: apiHeaders(c) });
    if (getRes.ok) state.sha = (await getRes.json()).sha;

    const content = JSON.stringify(state.sources, null, 2) + "\n";
    const body = {
      message: `chore: 网页更新源列表 (${new Date().toISOString().slice(0, 16).replace("T", " ")})`,
      content: b64EncodeUnicode(content),
      branch: c.branch,
    };
    if (state.sha) body.sha = state.sha;

    const res = await fetch(contentsUrl(c), {
      method: "PUT",
      headers: { ...apiHeaders(c), "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(`HTTP ${res.status} ${err.message || ""}`);
    }
    const out = await res.json();
    state.sha = out.content ? out.content.sha : state.sha;
    state.dirty = false;
    saveConfig();
    toast("已提交到 GitHub，Actions 稍后自动检测", "ok");
  } catch (e) {
    toast("保存失败：" + e.message, "err");
  } finally {
    btn.disabled = false; btn.textContent = "保存到 GitHub";
  }
}

function downloadJson() {
  if (!state.sources) { toast("请先加载 sources.json", "err"); return; }
  const blob = new Blob([JSON.stringify(state.sources, null, 2) + "\n"], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "sources.json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已下载 sources.json", "ok");
}

function updateSaveState() {
  $("saveBtn").disabled = !state.sources;
}

restoreConfig();
$("loadBtn").onclick = loadSources;
$("saveBtn").onclick = saveToGitHub;
$("downloadBtn").onclick = downloadJson;
$("dedupeBtn").onclick = dedupeSources;
$("addBtn").onclick = addSource;
$("search").oninput = render;
$("api").addEventListener("keydown", (e) => { if (e.key === "Enter") addSource(); });
["owner", "repo", "branch"].forEach((id) => $(id).addEventListener("change", saveConfig));
$("token").addEventListener("change", saveConfig);
setInterval(updateSaveState, 300);
</script>
</body>
</html>
